<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AS Roma Cards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>AS Roma Cards</h1>
    <p class="subtitle">In Construction</p>
    <div class="lang-switch">
      <button id="lang-en" class="active">EN</button>
      <button id="lang-bg">BG</button>
    </div>
  </header>

  <main class="container">
    <section class="card-section">
      <h2>Last Match</h2>
      <div id="last-match-card" class="card-preview"></div>
      <button id="download-last-match" class="download-btn">Download Card</button>
    </section>

    <section class="card-section">
      <h2>Next Match</h2>
      <div id="next-match-card" class="card-preview"></div>
      <button id="download-next-match" class="download-btn">Download Card</button>
    </section>

    <section class="card-section">
      <h2>Standings</h2>
      <div id="standings-card" class="card-preview"></div>
      <button id="download-standings" class="download-btn">Download Card</button>
    </section>

    <section class="card-section">
      <h2>Squad</h2>
      <div id="squad-list" class="squad-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Data: SportMonks Football API</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
