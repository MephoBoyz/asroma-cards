name: Update Matchday Data

on:
  schedule:
    # Daily at 09:00 UTC; script will decide if it’s a matchday
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch AS Roma data
        run: python src/updater/fetch_roma_data.py

      - name: Render cards (placeholder)
        run: |
          mkdir -p cards_output
          echo "Card rendering will be implemented next." > cards_output/placeholder.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/matchday-data
          title: "Update matchday data and cards"
          body: |
            Auto-generated update for AS Roma data and cards.
            Please review and merge to publish.
          commit-message: "chore: update matchday data"
          base: main
