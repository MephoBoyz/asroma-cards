name: Test BigBallsData Roma Statistics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-statistics:
    name: Test finished Roma match statistics
    runs-on: ubuntu-latest

    steps:
      - name: Find stored Roma match and test statistics
        env:
          BIGBALLSDATA_TOKEN: ${{ secrets.BIGBALLSDATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          token = (os.environ.get("BIGBALLSDATA_TOKEN") or "").strip()

          if not token:
              print("ERROR: BIGBALLSDATA_TOKEN is missing.")
              sys.exit(1)

          base_url = "https://api.bigballsdata.com/v1"
          headers = {
              "X-Api-Key": token,
              "Accept": "application/json"
          }

          response = requests.get(
              f"{base_url}/stored/matches",
              headers=headers,
              params={
                  "sport": "football",
                  "league": "serie_a",
                  "limit": 100
              },
              timeout=30
          )

          print(f"Stored-match list HTTP status: {response.status_code}")

          if response.status_code != 200:
              print(response.text[:1200])
              sys.exit(1)

          payload = response.json()
          matches = payload.get("data", [])

          print(f"Stored matches returned: {len(matches)}")

          roma_matches = [
              match for match in matches
              if "roma" in json.dumps(match).lower()
          ]

          print(f"Stored Roma matches found: {len(roma_matches)}")

          if not roma_matches:
              print("No stored Roma match found in this response.")
              print("First stored match preview:")
              print(json.dumps(matches[:1], ensure_ascii=False, indent=2))
              sys.exit(0)

          match = next(
              (
                  item for item in roma_matches
                  if "atalanta" in json.dumps(item).lower()
              ),
              roma_matches[0]
          )

          match_id = (
              match.get("id")
              or match.get("match_id")
              or match.get("game_id")
          )

          print(f"Selected stored match ID: {match_id}")
          print("Selected match:")
          print(json.dumps(match, ensure_ascii=False, indent=2))

          if not match_id:
              print("No usable stored match ID was returned.")
              sys.exit(0)

          detail = requests.get(
              f"{base_url}/stored/matches/{match_id}",
              headers=headers,
              timeout=30
          )

          print(f"\nStored match detail HTTP status: {detail.status_code}")
          print(detail.text[:3000])

          stats = requests.get(
              f"{base_url}/stored/matches/{match_id}/stats",
              headers=headers,
              timeout=30
          )

          print(f"\nStored match stats HTTP status: {stats.status_code}")
          print(stats.text[:5000])

          lineups = requests.get(
              f"{base_url}/stored/matches/{match_id}/lineups",
              headers=headers,
              timeout=30
          )

          print(f"\nStored match lineups HTTP status: {lineups.status_code}")
          print(lineups.text[:5000])
          PY
