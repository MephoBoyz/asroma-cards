name: Test BigBallsData AS Roma Enrichment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover Roma, Serie A and match enrichment
    runs-on: ubuntu-latest

    steps:
      - name: Test BigBallsData soccer data
        env:
          BIGBALLSDATA_TOKEN: ${{ secrets.BIGBALLSDATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          token = (os.environ.get("BIGBALLSDATA_TOKEN") or "").strip()

          if not token:
              print("ERROR: BIGBALLSDATA_TOKEN is missing.")
              sys.exit(1)

          base_url = "https://api.bigballsdata.com/v1"
          headers = {
              "X-Api-Key": token,
              "Accept": "application/json"
          }

          def call(label, path, params=None):
              response = requests.get(
                  f"{base_url}{path}",
                  headers=headers,
                  params=params or {},
                  timeout=30
              )

              print("\n" + "=" * 70)
              print(label)
              print(f"URL: {response.url}")
              print(f"HTTP status: {response.status_code}")

              if response.status_code != 200:
                  print("Response preview:")
                  print(response.text[:800])
                  return None

              try:
                  payload = response.json()
              except ValueError:
                  print("Response is not JSON:")
                  print(response.text[:800])
                  return None

              print(json.dumps(payload, ensure_ascii=False, indent=2)[:1800])
              return payload

          def list_from(payload, names):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              containers = [
                  payload,
                  payload.get("data", {})
              ]

              for container in containers:
                  if isinstance(container, list):
                      return container

                  if isinstance(container, dict):
                      for name in names:
                          value = container.get(name)
                          if isinstance(value, list):
                              return value

              return []

          teams_payload = call(
              "1. Team search: AS Roma",
              "/teams",
              {
                  "sport": "soccer",
                  "search": "AS Roma",
                  "limit": 20
              }
          )

          teams = list_from(
              teams_payload,
              ["teams", "results", "items"]
          )

          roma_team = None

          for team in teams:
              if "roma" in json.dumps(team).lower():
                  roma_team = team
                  break

          if roma_team:
              print("\nAS Roma candidate:")
              print(json.dumps(roma_team, ensure_ascii=False, indent=2))
          else:
              print("\nNo AS Roma team found from the team search.")

          standings_payload = call(
              "2. Serie A standings",
              "/standings",
              {
                  "sport": "soccer",
                  "league": "serie_a"
              }
          )

          matches_payload = call(
              "3. Serie A match list",
              "/matches",
              {
                  "sport": "soccer",
                  "league": "serie_a",
                  "limit": 100
              }
          )

          matches = list_from(
              matches_payload,
              ["matches", "results", "items", "games"]
          )

          roma_matches = [
              match for match in matches
              if "roma" in json.dumps(match).lower()
          ]

          print(f"\nRoma match candidates: {len(roma_matches)}")

          if roma_matches:
              print("\nFirst Roma match candidate:")
              print(json.dumps(roma_matches[0], ensure_ascii=False, indent=2))

          selected_match = roma_matches[0] if roma_matches else None

          if not selected_match:
              print("\nNo Roma match found. Skipping detail/event/stats tests.")
              sys.exit(0)

          match_id = (
              selected_match.get("id")
              or selected_match.get("match_id")
              or selected_match.get("game_id")
          )

          print(f"\nSelected match ID: {match_id}")

          if not match_id:
              print("No ID field on selected match. Skipping detail tests.")
              sys.exit(0)

          call("4. Match detail", f"/matches/{match_id}")
          call("5. Match events", f"/matches/{match_id}/events")
          call("6. Match statistics", f"/matches/{match_id}/stats")

          if roma_team:
              team_id = roma_team.get("id") or roma_team.get("team_id")

              if team_id:
                  call(
                      "7. Team player list",
                      "/players",
                      {
                          "sport": "soccer",
                          "team_id": team_id,
                          "limit": 100
                      }
                  )

          print("\nBigBallsData discovery complete.")
          PY
