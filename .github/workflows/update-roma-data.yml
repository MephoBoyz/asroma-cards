name: Update AS Roma Data for Review

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Create/update a review PR even outside the matchday window"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "15 8,13,18,23 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-roma-data
  cancel-in-progress: false

jobs:
  check-matchday:
    name: Check AS Roma matchday window
    runs-on: ubuntu-latest

    outputs:
      should_update: ${{ steps.decision.outputs.should_update }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Decide whether an update is needed
        id: decision
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          import requests

          token = (os.environ.get("FOOTBALL_DATA_TOKEN") or "").strip()
          force_update = (os.environ.get("FORCE_UPDATE") or "").lower() == "true"

          if not token:
              print("Missing FOOTBALL_DATA_TOKEN.", file=sys.stderr)
              sys.exit(1)

          now = datetime.now(timezone.utc)
          start = (now - timedelta(hours=48)).strftime("%Y-%m-%d")
          end = (now + timedelta(hours=48)).strftime("%Y-%m-%d")

          response = requests.get(
              "https://api.football-data.org/v4/teams/100/matches",
              headers={
                  "X-Auth-Token": token,
                  "Accept": "application/json"
              },
              params={
                  "dateFrom": start,
                  "dateTo": end,
                  "limit": 20
              },
              timeout=30
          )

          print(f"HTTP status: {response.status_code}")
          print(f"Matchday check range: {start} to {end} UTC")

          if response.status_code != 200:
              print(response.text[:500], file=sys.stderr)
              sys.exit(1)

          matches = response.json().get("matches", [])

          meaningful_statuses = {
              "SCHEDULED",
              "TIMED",
              "IN_PLAY",
              "PAUSED",
              "FINISHED",
              "POSTPONED",
              "SUSPENDED",
              "CANCELLED"
          }

          relevant = [
              match for match in matches
              if match.get("status") in meaningful_statuses
          ]

          should_update = force_update or bool(relevant)

          if force_update:
              reason = "Manual force update requested."
          elif relevant:
              reason = (
                  f"Found {len(relevant)} AS Roma fixture(s) "
                  "within the ±48-hour matchday window."
              )
          else:
              reason = "No AS Roma fixture in the ±48-hour matchday window."

          print(reason)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_update={str(should_update).lower()}\n")
              output.write(f"reason={reason}\n")
          PY

  generate-review-pr:
    name: Generate data and create review PR
    needs: check-matchday
    if: needs.check-matchday.outputs.should_update == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate fresh AS Roma data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: |
          python src/updater/fetch_roma_data.py

      - name: Generate social-media card PNGs
        run: |
          python src/cards/render_cards.py

      - name: Show generated-data summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/data/roma.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          last_match = data.get("last_match") or {}
          next_match = data.get("next_match") or {}
          standing = data.get("standings", {}).get("serie_a", {}).get("roma") or {}

          print(f"Generated file: {path}")
          print(f"Squad members: {len(data.get('squad', []))}")
          print(
              "Last match: "
              f"{last_match.get('home_team', {}).get('name')} vs "
              f"{last_match.get('away_team', {}).get('name')}"
          )
          print(
              "Next match: "
              f"{next_match.get('home_team', {}).get('name')} vs "
              f"{next_match.get('away_team', {}).get('name')}"
          )
          print(
              "Serie A: "
              f"position {standing.get('position')}, "
              f"points {standing.get('points')}"
          )
          PY

      - name: Create or update review pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update AS Roma matchday snapshot"
          branch: "automation/roma-data-update"
          delete-branch: true
          title: "chore(data): review AS Roma matchday update"
          body: |
            ## AS Roma data update

            This pull request was generated automatically.

            **Reason:** ${{ needs.check-matchday.outputs.reason }}

            It updates:

            - `public/data/roma.json`
            - `public/cards/last-match-en.png`
            - `public/cards/last-match-bg.png`
            - `public/cards/next-match-en.png`
            - `public/cards/next-match-bg.png`
            - Last completed match and next fixture
            - Recent and upcoming fixtures
            - Serie A standing and points
            - TheSportsDB artwork references

            Review the data and generated PNG cards. Merge this pull request to allow Netlify to publish the approved version.
          labels: |
            automated
            data-update
            cards
          base: main

      - name: Report result
        run: |
          if [ -n "${{ steps.create_pr.outputs.pull-request-url }}" ]; then
            echo "Review PR: ${{ steps.create_pr.outputs.pull-request-url }}"
          else
            echo "No PR created or updated because generated data and cards did not change."
          fi

  skip-report:
    name: No update needed
    needs: check-matchday
    if: needs.check-matchday.outputs.should_update != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped run
        run: |
          echo "No data PR created."
          echo "Reason: ${{ needs.check-matchday.outputs.reason }}"
